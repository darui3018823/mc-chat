name: Release

on:
  push:
    tags:
      - "v*"
  # Preview the notes for an existing tag without creating a release.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to write notes for
        required: true

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v5
        with:
          # Tags and history for the notes.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Gradle daemon toolchain (gradle-daemon-jvm.properties); the mod targets Java 21.
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v5

      - name: Check tag matches mod version
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version=$version in gradle.properties" >&2
            exit 1
          fi

      - name: Build
        run: ./gradlew build

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          jar="build/libs/mcchat-${GITHUB_REF_NAME#v}.jar"
          # Notes by Claude Haiku; GitHub's generated notes if that fails.
          if ../.github/scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"; then
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" "$jar" --title "MCChat $GITHUB_REF_NAME" "${notes[@]}"

  preview-notes:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Write notes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAG: ${{ inputs.tag }}
        run: .github/scripts/release-notes.sh "$TAG" >> "$GITHUB_STEP_SUMMARY"

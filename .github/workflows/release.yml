name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Gradle daemon toolchain (gradle-daemon-jvm.properties); the mod targets Java 21.
          java-version: |
            21
            25

      - uses: gradle/actions/setup-gradle@v5

      - name: Check tag matches mod version
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version=$version in gradle.properties" >&2
            exit 1
          fi

      - name: Build
        run: ./gradlew build

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar="build/libs/mcchat-${GITHUB_REF_NAME#v}.jar"
          gh release create "$GITHUB_REF_NAME" "$jar" --title "MCChat $GITHUB_REF_NAME" --generate-notes

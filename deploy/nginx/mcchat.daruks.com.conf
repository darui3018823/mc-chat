# /etc/nginx/sites-available/mcchat.daruks.com
# Cloudflare (proxied, SSL "Full") -> nginx (Origin cert) -> mcchat-server on 127.0.0.1:25566

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name mcchat.daruks.com;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mcchat.daruks.com;

    ssl_certificate     /etc/ssl/certs/cf.crt;
    ssl_certificate_key /etc/ssl/private/cf.key;

    client_max_body_size 16k;

    location = /ws {
        proxy_pass http://127.0.0.1:25566;
        proxy_http_version 1.1;

        proxy_set_header Upgrade          $http_upgrade;
        proxy_set_header Connection       $connection_upgrade;
        proxy_set_header Host             $host;
        proxy_set_header Authorization    $http_authorization;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Real-IP        $http_cf_connecting_ip;

        # The server pings every 30s; this only bounds dead connections.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:25566;
    }

    location / {
        return 404;
    }
}
